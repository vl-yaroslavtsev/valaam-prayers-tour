			{{else}}

								 data-open-in="page"

											  name="rite"

				<div class="block-title">

				<div class="list form-list no-hairlines-md">

													 placeholder="Выберите дату поминовения"

														name="period"

				<div class="block-title">Напишите имена</div>
				<div class="list form-list no-hairlines-md vm-rites-names">

						{{#each names}}
						<!--suppress HtmlUnknownAttribute -->

									<!--suppress HtmlUnknownAttribute -->

											 name="donate"
											 id="formRites-donate"

				<div class="list form-list no-hairlines-md ext-margin">

								<div class="item-input-wrap">
									<!--suppress HtmlUnknownAttribute -->
									<input type="email"
												 name="email"
												 value="{{email}}"

				<!--
				<div class="list form-list no-hairlines-md ext-margin">
					<ul>
						<li>
							<label class="item-content item-checkbox item-checkbox-outline">
								<input name="confirm_orthodox"
								       type="checkbox"
									   value="1"/>

									<div class="item-title">Подтверждаю, что все имена принадлежат крещёным православным христианам.</div>

<!--suppress JSAnnotator, JSIgnoredPromiseFromCall -->
<script>
	import { Request, Dom7 as $$ } from 'framework7';
	import {
		set,
		format,
		parse,
		addDays,
		subDays,
		getUnixTime
	} from '../js/utils/date-utils.js';
	import dataManager from '../js/data/manager.js';
	import { BASE_URL, RITES_API_URL } from '../js/config.js';
	import { ApiError } from '../js/utils/api-error.js';


	const getUID = () => {
		return window.crypto.getRandomValues(new Uint32Array(4)).reduce((acc, el) => acc += el.toString(16), '');
	};

	const getClientId = () => {
		let id = localStorage.getItem("rites-client-id");
		if (!id) {
			id = getUID();
			localStorage.setItem("rites-client-id", id);
		}

		return id;        
	};

	let app, 
			$el, 
			valaamGid, 
			ritesTypes, 
			ritesStatuses,
			ritesHealthExplanations,
			ritesReposeExplanations;

	const ritesConfig = {
		riteDefault: 7160,
    maxNames: 10
	}
	export default {
		methods: {
			async loadYooKassaScript() {
				return new Promise((resolve, reject) => {
					// Проверяем, не загружен ли уже скрипт
					if (window.YooMoneyCheckoutWidget) {
						resolve(window.YooMoneyCheckoutWidget);
						return;
					}

					const script = document.createElement('script');
					script.src = 'https://static.yoomoney.ru/checkout-client/checkout-widget.js';
					script.async = true;
					
					script.onload = () => resolve(window.YooMoneyCheckoutWidget);
					script.onerror = (error) => reject(new Error('Не удалось загрузить скрипт YooKassa: ' + error));
					
					document.head.appendChild(script);
				});
			},

			async renderWidget(token, { onDone = () => {}, onError = () => {} } = {}) {
				await this.loadYooKassaScript();
				const checkout = new window.YooMoneyCheckoutWidget({
					confirmation_token: token,
					customization: {
						//Настройка способа отображения
						modal: true
					},
					error_callback: (error) => onError(error)
				});

				checkout.on("complete", ({status}) => {
					onDone(status);
					checkout.destroy();
				});

				//Отображение платежной формы в контейнере
				checkout.render();
			},

			async saveRite({ rite, date, payment, donate, names } = {}) {

				const data = {
					"clientId":  getClientId(),
					"rite": rite,
					"date": date,
					"payment": payment,
					"donate": donate,
					"names": names
				};

				console.log('saveRite data', data);

				try {
					const response = await fetch(`${RITES_API_URL}rites`, {
						method: 'POST',
						headers: {
								'Content-Type': 'application/json;charset=utf-8'
						},
						body: JSON.stringify(data)
					});

					const result = await response.json();

					if(response.status === 200) {
							return result;

					} else {
						const errors = [];
						if(result.fullErrors){
							const fullErrors = result.fullErrors.map(error => error.description);
							if(fullErrors.length) {
								errors.push(...fullErrors);
							}
						}  
						
						if(result.fieldsErrors) {
							const fieldsErrors = result.fieldsErrors.map(error => `Поле ${error.field} : ${error.description}`);
							if(fieldsErrors.length) {
								errors.push(...fieldsErrors);
							}
						}

						if(errors.length) {
							throw new ApiError(errors.join('<br>'));
						}
					}

				} catch (ex) {
						throw ex;
				}

				return result;
			},

			async initiatePayment(riteId, email) {
				const data = {
						clientId: getClientId(),
						email: email,
						payment: "widget",
						valaam_gid: valaamGid,
						ids:[riteId]
				};

				//console.log('initiatePayment data', data);

				try {
					const response = await fetch(`${RITES_API_URL}rites/initiatePayment`, {
						method: 'POST',
						headers: {
								'Content-Type': 'application/json;charset=utf-8'
						},
						body: JSON.stringify(data)
					});

					const result = await response.json();

					if (response.status === 200) {
							return result;

					} else {
						const errors = [];
						if(result.fullErrors){
							const fullErrors = result.fullErrors.map(error => error.description);
							if(fullErrors.length) {
								errors.push(...fullErrors);
							}
						}  
						
						if(result.fieldsErrors) {
							const fieldsErrors = result.fieldsErrors.map(error => `Поле ${error.field} : ${error.description}`);
							if(fieldsErrors.length) {
								errors.push(...fieldsErrors);
							}
						}

						if(errors.length) {
							throw new ApiError(errors.join('<br>'));
						}
					}

				} catch (ex) {
						throw ex;
				}
			},
			async donate() {
				let self = this,
					$form = this.$$('#formRites'),
					formData = app.form.convertToData('#formRites'),
					$btn = this.$$('#formRites-button')
				;

				app.input.validateInputs($form);
				let errors = $form.find('input.input-invalid');

				if(!formData.names) {
					app.methods.showError('Введите имя');
					this.$router.navigate(this.$$('.vm-rites-names > ul > li:first-child > a').attr('href'));
					return;
				}

				if(errors.length)
					return;

				app.preloader.show();
				$btn.addClass('disabled');

				app.methods.storageSet('rite-payment', formData.payment);
				app.methods.storageSet('rite-email', formData.email);
				
				// console.log('formData', formData);

				try {
						const rite = await this.saveRite({
							rite: formData.rite, 
							date: format(parse(formData.period.split('-')[0]), 'dd.MM.yyyy'), 
							payment: "widget", 
							donate: formData.donate, 
							names: formData.names.split('\n').map(el => {
								const arr = el.split(' ');
								const name = arr.pop();
								const explanation = arr.join(' ');
								return {
									name,
									explanation
								}
							})
						});
						//console.log('saveRite response', rite);
						const riteId = rite.id;
						
						const payment = await this.initiatePayment(riteId, formData.email, formData.payment);
						//console.log('initiatePayment response', payment);
						const { confirmationToken } = payment;
						if (!confirmationToken) {
							throw new Error('no confirmationToken!');
						}

						this.renderWidget(confirmationToken, {
							onDone:  () => {
								self.$router.navigate('/rites-status?id=' + riteId)
							}
						});
					} catch (err) {
						if (err instanceof ApiError) {
							app.methods.showError(err.message);
						} else {
							app.methods.showLoadError();
						}
						throw err;
					} finally {
						$btn.removeClass('disabled');
						app.preloader.hide();
					}
				;
			},
			onRiteChanged({target}) {
				let selectedRite = ritesTypes.find(({id}) => id == target.value);
				selectedRite.group = selectedRite.name.split(' - ')[0];

				this.$setState({
					selectedRite
				});

				setStartDate.call(this);
				calculateDonation.call(this);

				$el = this.$el;
				let	$namesValue = $el.find('#formRites-names'),
					$names = $el.find('.vm-rites-names li:not(.display-none)'),
					names = [];
				$names.forEach((value) => {
					let name = value.querySelector('.item-title').innerText.trim(),
						explanations = value.querySelector('.item-after').innerText.trim()
					;

					if ((selectedRite.type === "repose" && ritesReposeExplanations.includes(explanations)) || 
						(selectedRite.type === "health" && ritesHealthExplanations.includes(explanations))) {
						explanations = "";
						value.querySelector('.item-after').innerText = explanations;
					}

					if(name) names.push((explanations + ' ' + name).trim());
				});

				$namesValue.val(names.join('\n'));
			}
		},
		on: {
			pageInit() {
				$el = this.$el;

				$el.on('focusin', 'input', (e) => {
					app.methods.scrollToEl(
						$$(e.target).parents('.list').prev('.block-title')
					);
				});
			},
			async pageAfterIn(e, page) {
				await this.loadingPromise;

				this.$tick(() => {
					let	$namesValue = $el.find('#formRites-names'),
							$names = $el.find('.vm-rites-names li:not(.display-none)'),
							names = []
						;
					$names.forEach((value) => {
						let name = value.querySelector('.item-title').innerText.trim(),
							explanations = value.querySelector('.item-after').innerText.trim()
						;

						if(name) names.push((explanations + ' ' + name).trim());
					});

					this.$setState({
						namesCount: names.length
					});

					$namesValue.val(names.join('\n'));

					calculateDonation.call(this);

					// временно
					$el.find('#formRites-email').attr('autocomplete', 'home email');

					if (!this.calendarPeriod) {
						this.calendarPeriod = app.calendar.create({
							inputEl: $el.find('#formRites-period-formatted')[0],
							closeOnSelect: true,
							formatValue: ([date]) => {
		 						const oneDayRite = (this.selectedRite.periodDays === 1);
								return [
									oneDayRite ?
										`${format(date, 'd MMMM yyyy')} г.` :
										`c ${format(date, 'd MMMM yyyy')} г. по ${format(addDays(date, this.selectedRite.periodDays - 1), 'd MMMM yyyy')} г.`
								];
							},
							disabled: (date) => {
								const minDateStart = addDays(new Date(), this.selectedRite.processing);
								const weekDays = this.selectedRite.weekDays || [];

								return date < minDateStart ||
											 (weekDays.length && !weekDays.includes(Number(format(date, 'i'))));
							},
							on: {
								change: (calendar, [date]) => {
									const oneDayRite = (this.selectedRite.periodDays === 1);
									const period = oneDayRite ?
										format(date) :
										`${format(date)}-${format(addDays(date, this.selectedRite.periodDays - 1))}`
									;
									const now = new Date();

									date = set(date, {
										hours: now.getHours(),
										minutes: now.getMinutes(),
										seconds: now.getSeconds()
									});
									const activateTs = getUnixTime(subDays(
										date,
										this.selectedRite.processing + 1
									));
									this.$setState({
										period,
										activateTs
									});
								}
							}
						});
						setStartDate.call(this);
					}
				});
			},
			pageBeforeRemove(e, page) {
					$el.off('focusin');
			}
		},
		data() {
			app = this.$app;

			return {
				loadingPromise: loadData.call(this),
				loading: true
			};
		}
	}

	function setStartDate() {
		const weekDays = this.selectedRite.weekDays || [];
		let date = addDays(new Date(), this.selectedRite.processing + 1);

		if (weekDays.length > 0) {
			while (true) {
				if (weekDays.includes(Number(format(date, 'i')))) {
					break;
				}
				date = addDays(date, 1);
			}	
		}

		if ( this.calendarPeriod ) {
			this.calendarPeriod.setValue([date]);
		}
	}

	function calculateDonation() {
		this.$tick(() => {
			let donation = (this.namesCount * this.selectedRite['price']) || '';
			this.$setState({
				donation
			}, () => {
				if (donation) app.input.validateInputs($el.find('#formRites'));
			});
		});
	}

	async function loadData() {
		try {
			// Должен быть первым запросом к rites API в сессии
			const response = await dataManager.get('valaamGid');
			valaamGid = response.gid;
			[
				ritesTypes, 
				ritesStatuses,
				ritesHealthExplanations,
				ritesReposeExplanations
			] = await Promise.all([
				dataManager.get('ritesTypes'),
				dataManager.get('ritesStatuses'),
				dataManager.get('ritesHealthExplanations'),
				dataManager.get('ritesReposeExplanations')
			]);

			//console.log(ritesTypes, ritesStatuses);
			//await new Promise((resolve) => setTimeout(resolve, 160000));
			handleData.call(this);
			app.emit('mainPageLoaded', 'rites', this);
		} catch (err) {
			app.methods.showLoadError();
			throw err;
		}
	}

	function handleData() {
		let groupName = '', idx = 0, count;
		let rites = ritesTypes.reduce((result, item) => {
			let tmp = item.name.split(' - ');
			if(tmp[0] !== groupName)
				result.push({
					id: idx++,
					name: groupName = tmp[0],
					items: []
				});

			result[idx-1].items.push({
				id: item.id,
				name: tmp[1].replace(/\((\d+) /, '($1&nbsp;'),
				selected: item.id === ritesConfig.riteDefault ? "selected" : ""
			});
			return result;
		}, []);
		let selectedRite = ritesTypes.find(({id}) => id == ritesConfig.riteDefault);
		selectedRite.group = selectedRite.name.split(' - ')[0];

		let names = [];

		if(app.data.debug) {
			names.push(['Иоанна', 'раба Божия', true, app.utils.id()]);
			// names.push(['Иулии', 'рабы Божией', true, app.utils.id()]);
			// names.push(['Софии', '', true, app.utils.id()]);
		}

		if(names.length < ritesConfig.maxNames)
			names.push(['', '', true, app.utils.id()]);

		for(idx = 0, count = ritesConfig.maxNames - names.length; idx < count; idx++)
			names.push(['', '', false, app.utils.id()]);

		this.$setState({
			rites,
			selectedRite,
			names,
			namesCount: 0,
			donation: '',
			//
			email: app.methods.storageGet('rite-email'),
			period: '',

			loading: false
		});
	}
